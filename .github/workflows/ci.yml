name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  smoke:
    name: ship smoke (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PagedMoE
        run: |
          python -m pip install -U pip setuptools wheel
          # Editable install; mlx/mlx-lm come in on darwin.
          python -m pip install -e ".[dev]"

      - name: Optional native read extension
        run: |
          # Best effort, same path users get from setup.py. Failure is fine,
          # runtime falls back to Python / JIT.
          python setup.py build_ext --inplace || true
          python - <<'PY'
          from pagedmoe import native_read
          mod = native_read.get_module()
          state, detail = native_read.status()
          print(f"native_read: {state}" + (f" ({detail})" if detail else ""))
          print(f"extension:   {'yes' if mod is not None else 'no (Python pool)'}")
          PY

      - name: Ship checklist
        env:
          PAGED_MOE_HOOK: "0"
        run: |
          python - <<'PY'
          import importlib
          import sys
          from pathlib import Path

          ok = True

          def check(label, cond, detail=""):
              global ok
              mark = "ok" if cond else "FAIL"
              if not cond:
                  ok = False
              extra = f"  {detail}" if detail else ""
              print(f"  [{mark}] {label}{extra}")

          print()
          print("PagedMoE ship smoke")
          print("=" * 40)

          import pagedmoe
          from pagedmoe import config
          from pagedmoe import native_read

          import tomllib
          want = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          check("version", pagedmoe.__version__ == want, f"{pagedmoe.__version__} (pyproject {want})")
          check("PRUNE default off", config.PRUNE == 0.0, repr(config.PRUNE))
          check("NATIVE_READ default on", config.NATIVE_READ == "on", repr(config.NATIVE_READ))
          check("VERIFY default on", config.VERIFY is True)
          check("SIDECAR default off", config.SIDECAR is False)
          check("SIDECAR_HEAD_PRUNE default off", config.SIDECAR_HEAD_PRUNE is False)

          c_src = Path(native_read.__file__).with_name("_native_read.c")
          check("ships _native_read.c", c_src.is_file(), str(c_src.name))

          mods = [
              "pagedmoe.user_config",
              "pagedmoe.machine",
              "pagedmoe.machine.ladder",
              "pagedmoe.early_decode",
              "pagedmoe.time_to_warm",
              "pagedmoe.native_read",
              "pagedmoe.seal",
              # mlx-backed modules last (fresh CI install loads mlx once cleanly)
              "pagedmoe.cache",
              "pagedmoe.streaming",
              "pagedmoe.verify_decode",
              "pagedmoe.prefix_disk",
              "pagedmoe.server",
              "pagedmoe.mlx_hook",
          ]
          for name in mods:
              try:
                  importlib.import_module(name)
                  check(f"import {name}", True)
              except Exception as e:
                  check(f"import {name}", False, f"{type(e).__name__}: {e}")

          print("=" * 40)
          if not ok:
              print("ship smoke FAILED")
              sys.exit(1)
          print("ship smoke passed")
          PY

      - name: Machine envelope tests (no GPU)
        env:
          PAGED_MOE_HOOK: "0"
        run: python -m pytest tests/test_machine.py

      - name: Detect this Mac + print a ladder
        env:
          PAGED_MOE_HOOK: "0"
        run: |
          echo "== runner machine =="
          paged-moe machine || true
          echo
          echo "== catalog (named Mac classes) =="
          paged-moe machine catalog
          echo
          echo "== ladder @ 48 GB baseline =="
          paged-moe ladder --profile host-m5-pro-48gb
