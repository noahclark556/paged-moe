[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paged-moe"
version = "0.3.2"
description = "PagedMoE: run MoE models bigger than your Mac's RAM by paging experts from the SSD through mlx-lm"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later OR LicenseRef-PagedMoE-Commercial" }
authors = [{ name = "Noah Clark" }]
keywords = ["mlx", "moe", "apple-silicon", "inference", "paged-experts"]
dependencies = [
  # Pinned to the versions the engine was built, tuned and benchmarked on.
  # The engine hooks mlx-lm internals and the tokenizer stack, so a newer
  # release can break it or change the numbers in the docs.
  "mlx==0.32.2; sys_platform == 'darwin'",
  "mlx-lm==0.31.3; sys_platform == 'darwin'",
  "numpy==2.3.5",
  "huggingface_hub==1.16.1",
  "transformers==5.14.1",
  "tokenizers==0.22.2",
  "safetensors==0.8.0",
  "sentencepiece==0.2.2",
  "protobuf==7.35.1",
  "jinja2==3.1.6",
  # paged-moe-config.yaml and the per-model paged_moe.yaml.
  "pyyaml==6.0.3",
  # Kimi K2 ships a tiktoken tokenizer (tokenization_kimi.py).
  "tiktoken==0.13.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/noahclark556/paged-moe"
Documentation = "https://github.com/noahclark556/paged-moe#readme"
Issues = "https://github.com/noahclark556/paged-moe/issues"
License = "https://github.com/noahclark556/paged-moe/blob/main/LICENSING.md"

[project.scripts]
paged-moe = "pagedmoe.mlx_hook:main"
paged-moe-server = "pagedmoe.launch_env:server_main"
paged-moe-pretrain = "pagedmoe.pretrain_sidecar:main"

[tool.setuptools.packages.find]
include = ["pagedmoe*"]

[tool.setuptools.package-data]
pagedmoe = ["pretrained_sidecar/*", "_native_read.c", "benchmark/data/*"]

[tool.setuptools]
license-files = ["LICENSE", "NOTICE", "LICENSING.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
