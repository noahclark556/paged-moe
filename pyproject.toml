[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paged-moe"
version = "0.3.1"
description = "PagedMoE: run MoE models bigger than your Mac's RAM by paging experts from the SSD through mlx-lm"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later OR LicenseRef-PagedMoE-Commercial" }
authors = [{ name = "Noah Clark" }]
keywords = ["mlx", "moe", "apple-silicon", "inference", "paged-experts"]
dependencies = [
  "numpy>=1.26",
  "huggingface_hub>=0.24",
  "mlx>=0.32; sys_platform == 'darwin'",
  "mlx-lm>=0.31.3; sys_platform == 'darwin'",
  # Kimi K2 ships a tiktoken tokenizer (tokenization_kimi.py).
  "tiktoken>=0.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/noahclark556/paged-moe"
Documentation = "https://github.com/noahclark556/paged-moe#readme"
Issues = "https://github.com/noahclark556/paged-moe/issues"
License = "https://github.com/noahclark556/paged-moe/blob/main/LICENSING.md"

[project.scripts]
paged-moe = "pagedmoe.mlx_hook:main"
paged-moe-server = "pagedmoe.server:main"
paged-moe-pretrain = "pagedmoe.pretrain_sidecar:main"

[tool.setuptools.packages.find]
include = ["pagedmoe*"]

[tool.setuptools.package-data]
pagedmoe = ["pretrained_sidecar/*", "_native_read.c"]

[tool.setuptools]
license-files = ["LICENSE", "NOTICE", "LICENSING.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
